# TrafficVision AI - default configuration
# Values map to app/config/settings.py dataclasses. Unknown keys are ignored.
# The Streamlit UI reads this file at each run; only the frame limit and the
# config path are editable in the sidebar.
# Keys marked RESERVED are parsed but NOT used by the current code.

processing_mode: balanced   # RESERVED: performance | balanced | accuracy (presets not applied)

detection:
  model_name: yolov8n.pt
  confidence_threshold: 0.35
  iou_threshold: 0.45
  processing_width: 640
  inference_interval: 2       # run detector+tracker on every Nth frame; other frames reuse state
  frame_skip: 0               # RESERVED
  classes: [2, 3, 5, 7]   # COCO ids: car, motorcycle, bus, truck
  device: cpu

tracking:
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  frame_rate: 30              # passed to ByteTrack; not derived from the video FPS
  minimum_consecutive_frames: 1
  trajectory_length: 40

speed:
  enabled: true               # set false to skip speed estimation
  pixels_per_meter: null              # set this OR calibration_points+real distance
  calibration_points: null            # e.g. [[120, 400], [520, 400]]
  calibration_real_distance_m: null   # real-world distance between the two points above
  smoothing_window: 5
  max_plausible_kmh: 220.0

ui:
  ui_update_interval: 5       # RESERVED
  show_trajectories: true
  show_labels: true
  max_table_rows: 200         # RESERVED
  theme_accent: "#2dd4bf"     # RESERVED

demo:                        # RESERVED: whole section is unused
  enabled: false
  demo_resolution_width: 480
  demo_inference_every_n_frames: 2
  reduce_ui_overhead: true
